<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - Secure login to your account">
  <title>Log in to TaskFlow</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  
  <!-- Design System Stylesheets -->
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <main class="login-page">
    <div class="container">
      <div class="row align-items-center justify-content-center min-vh-100">
        <div class="col-12 col-sm-11 col-md-8 col-lg-5 col-xl-4">
          
          <!-- Branding Section -->
          <section class="branding-section text-center mb-5" aria-labelledby="page-title">
            <img 
              src="../../assets/logo.svg" 
              alt="TaskFlow Logo" 
              class="logo mb-3"
              width="64"
              height="64"
              loading="eager">
            <h1 id="page-title" class="h2 fw-semibold">Log in to TaskFlow</h1>
          </section>

          <!-- Login Card -->
          <div class="login-card">
            <form id="loginForm" class="login-form" novalidate>
              
              <!-- Email Field -->
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input 
                  id="email"
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="name@company.com"
                  required
                  aria-describedby="email-error"
                  autocomplete="email">
                <div id="email-error" class="form-error mt-2" role="alert" aria-live="polite"></div>
              </div>

              <!-- Password Field -->
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="password-wrapper">
                  <input 
                    id="password"
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="••••••••"
                    required
                    aria-describedby="password-error"
                    autocomplete="current-password">
                  <button 
                    type="button" 
                    class="password-toggle" 
                    id="passwordToggle"
                    aria-label="Show password" 
                    aria-pressed="false"
                    tabindex="-1">
                    <span id="passwordToggleIcon" aria-hidden="true"></span>
                  </button>
                </div>
                <div id="password-error" class="form-error mt-2" role="alert" aria-live="polite"></div>
              </div>

              <!-- Options Row -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input 
                    id="rememberMe"
                    type="checkbox"
                    name="rememberMe"
                    class="form-check-input"
                    value="on">
                  <label for="rememberMe" class="form-check-label">
                    Remember me
                  </label>
                </div>
                <a href="#" class="text-decoration-none">Forgot password?</a>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary w-100 mb-4" id="submitBtn">
                Log in
              </button>
            </form>

            <!-- Divider -->
            <div class="divider mb-4">
              <span>OR CONTINUE WITH</span>
            </div>

            <!-- SSO Button -->
            <button type="button" class="btn btn-outline-secondary w-100" id="ssoBtn" aria-label="Sign in with Single Sign-On">
              <span id="ssoIcon" aria-hidden="true" class="me-2"></span>
              <span>Sign in with SSO</span>
            </button>
          </div>

          <!-- Sign Up Link -->
          <p class="text-center mt-4 text-muted">
            Don't have an account? 
            <a href="#" class="text-decoration-none">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer mt-auto">
    <div class="container">
      <div class="row align-items-center py-4">
        <div class="col-12 col-md-6 mb-3 mb-md-0">
          <p class="text-muted small mb-0">© 2024 TaskFlow Enterprise. All rights reserved.</p>
        </div>
        <div class="col-12 col-md-6">
          <nav class="footer-nav">
            <a href="#" class="text-muted text-decoration-none small">Privacy Policy</a>
            <a href="#" class="text-muted text-decoration-none small">Terms of Service</a>
            <a href="#" class="text-muted text-decoration-none small">Security</a>
            <a href="#" class="text-muted text-decoration-none small">Status</a>
          </nav>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Login Script -->
  <script type="module" src="./login.js"></script>
</body>
</html>
